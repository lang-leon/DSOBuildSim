<div class="overlay">
  <div class="window">
    <button class="close-button" (click)="cancel()">
      <img src="utility-icons/cancel-square.png" alt="Close" />
      <span class="tooltip">Close</span>
    </button>

    <h1>Select Dragon Stone</h1>

    <div class="filter-bar">
      <input type="text" placeholder="Search dragonstones..." [(ngModel)]="searchTerm" />

      <label class="toggle-switch">
        <input type="checkbox" [(ngModel)]="maxTierOnly" />
        <span class="slider"></span>
        Max tier only
      </label>
    </div>

    <div class="selection-grid-container">
      <div class="selection-grid">
        @for (dragonStone of getFilteredDragonStones(); track dragonStone.dragonStoneType) {
          @for (tier of getTiers(dragonStone); track tier) {
            <app-build-sim-button
              class="selection-button"
              [tooltipTitle]="dragonStoneService.getDragonStoneDefinitionName(dragonStone, tier)"
              [tooltipDescription]="
                dragonStoneService.getDragonStoneDefinitionDescription(dragonStone, tier)
              "
              [tooltipTitleClass]="getTierName(tier)"
              [icon]="dragonStoneService.getDragonStoneDefinitionIcon(dragonStone, tier)"
              (clicked)="selectDragonStone(dragonStone, tier)"
            ></app-build-sim-button>
          }
        }
      </div>
    </div>
  </div>
</div>
