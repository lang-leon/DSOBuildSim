<div class="overlay" [style.--popup-scale]="scale">
  <div class="window scaled-popup-window">
    <h1>Edit Jewel Trinket</h1>

    <h2>Jewels:</h2>

    <div class="trinket-slots">
      @for (jewel of jewels; track $index) {
        <div class="trinket-slot-wrapper">
          <app-build-sim-button
            class="trinket-slot"
            [slotName]="jewel !== null ? '' : 'Empty'"
            [tooltipTitle]="jewel !== null ? jewelService.getJewelInstanceName(jewel) : ''"
            [tooltipTitleClass]="jewel !== null ? getTierName(jewel.tier) : ''"
            [tooltipDescription]="jewelService.getJewelInstanceDescription(jewel)"
            [icon]="jewelService.getJewelInstanceIcon(jewel)"
            (clicked)="openJewelSelector($index)"
          ></app-build-sim-button>

          @if (jewel !== null) {
            <!-- Delete -->
            <button
              class="trinket-slot-action delete-button"
              (click)="deleteJewel($index); $event.stopPropagation()"
            >
              <img src="utility-icons/cancel-square.png" alt="Delete" />
              <span class="tooltip">Delete</span>
            </button>

            <!-- Copy -->
            @if (hasEmptyJewelSlot() && canSelectJewel(jewel.jewelType)) {
              <button
                class="trinket-slot-action copy-button"
                (click)="copyJewel($index); $event.stopPropagation()"
              >
                <img src="utility-icons/copy.png" alt="Copy" />
                <span class="tooltip">Copy to next empty slot</span>
              </button>
            }
          }
        </div>
      }
    </div>

    <div class="cc-buttons">
      <button class="accept-button" (click)="confirm()">
        <img src="utility-icons/confirm.png" alt="Confirm" />
        <span class="tooltip">Confirm</span>
      </button>

      <button class="cancel-button" (click)="cancel()">
        <img src="utility-icons/cancel.png" alt="Cancel" />
        <span class="tooltip">Cancel</span>
      </button>
    </div>
  </div>
</div>

@if (showJewelSelector) {
  <app-jewel-selector
    [jewelConfig]="jewelConfig"
    [canSelectJewel]="canSelectJewel.bind(this)"
    (cancelled)="closeJewelSelector()"
    (selected)="confirmJewelSelection($event)"
  >
  </app-jewel-selector>
}
