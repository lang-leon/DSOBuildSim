<div class="overlay">
  <div class="window">
    <button class="close-button" (click)="cancel()">
      <img src="utility-icons/cancel-square.png" alt="Close" />
      <span class="tooltip">Close</span>
    </button>

    <h1>Select Rune</h1>

    <div class="filter-bar">
      <input type="text" placeholder="Search runes..." [(ngModel)]="searchTerm" />

      <label class="toggle-switch">
        <input type="checkbox" [(ngModel)]="maxTierOnly" />
        <span class="slider"></span>
        Max tier only
      </label>
    </div>

    <div class="selection-grid-container">
      <div class="selection-grid">
        @for (rune of getFilteredRunes(); track rune.runeType) {
          @for (tier of getTiers(rune); track tier) {
            <app-build-sim-button
              class="selection-button"
              [tooltipTitle]="rune.name"
              [tooltipDescription]="runeService.getRuneDefinitionDescription(rune, tier)"
              [icon]="runeService.getRuneDefinitionIcon(rune, tier)"
              [disabled]="!canSelectRune(rune.runeType)"
              (clicked)="selectRune(rune, tier)"
            ></app-build-sim-button>
          }
        }
      </div>
    </div>
  </div>
</div>
